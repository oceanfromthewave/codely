name: Codely Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Codely
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Project Analysis
        run: |
          node packages/core/dist/cli.js . --json > report.json
          node scripts/ci-check-maintainability.mjs report.json
          
      - name: Upload Analysis Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codely-report
          path: report.json
