name: Codely Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Codely
        run: npm run build
        
      - name: Run Project Analysis
        run: |
          # Run analysis on the current directory
          # You can set a threshold for fatigue score or readability
          # For example, fail if any file has fatigue score > 8
          node packages/core/dist/cli.js . --json > report.json
          
          # Basic check: fail if average maintainability is too low
          MAINTAINABILITY=$(jq '.averageMaintainability' report.json)
          if (( $(echo "$MAINTAINABILITY < 5.0" | bc -l) )); then
            echo "Project maintainability is too low: $MAINTAINABILITY"
            exit 1
          fi
          
      - name: Upload Analysis Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codely-report
          path: report.json
